name: Deploy to home

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Deploy via SSH
        shell: bash
        run: |
          echo "Démarrage de la connexion vers le serveur distant..."
          
          # Exécution de la commande sur une seule ligne condensée pour éviter les bugs d'interpréteur du runner
          ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_home root@home.mesdonneesadministratives.fr "cd /opt/alapatch && git fetch --all && git reset --hard origin/main && docker build -t alapatch-prod . && if [ \$(docker ps -aq -f name=microkorg-editor) ]; then docker stop microkorg-editor && docker rm microkorg-editor; fi && docker run -d --restart unless-stopped -p 4321:4321 --name microkorg-editor alapatch-prod"
          
          echo "Le script de déploiement distant a été transmis avec succès."
