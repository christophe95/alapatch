name: Deploy to home

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (Non-Root Account)
        shell: bash
        run: |
          echo "Démarrage de la réplication Git et du build local..."
          
          # Connexion SSH locale vers le compte isolé 'deployer' de cette même VM
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /root/.ssh/id_home deployer@192.168.199.37 "
            cd /opt/home/alapatch &&
            
            echo '=> [1/4] Configuration du Remote avec l-IP locale...' &&
            git remote set-url origin git@192.168.199.52:cvancau/alapatch.git || git remote add origin git@192.168.199.52:cvancau/alapatch.git &&
            
            echo '=> [2/4] Synchronisation Git avec la clé dédiée gitea...' &&
            git config core.sshCommand 'ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /home/deployer/.ssh/id_gitea' &&
            git fetch --all &&
            git reset --hard origin/main &&
            git clean -fd &&
            
            echo '=> [3/4] Build de l-image Docker (Node 22 / Vite)...' &&
            docker build -t alapatch-app . &&
            
            echo '=> [4/4] Recyclage du conteneur sur le port 5000...' &&
            if [ \$(docker ps -aq -f name=alapatch-app) ]; then
              docker stop alapatch-app && docker rm alapatch-app;
            fi &&
            # Lancement sur le port 5000 comme demandé
            docker run -d --restart unless-stopped -p 5000:5000 --name alapatch-app alapatch-app &&
            
            echo '=> Déploiement local terminé avec succès !'
          "
    